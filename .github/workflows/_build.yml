name: Build

# Reusable build pipeline: assembles the plugin .jar, then runs the tests and the
# architecture checks. Called by ci.yml (every push / PR).
on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.metadata.outputs.version }}
      pretty_version:
        value: ${{ jobs.metadata.outputs.pretty_version }}
      is_dev:
        value: ${{ jobs.metadata.outputs.is_dev }}
      is_preview:
        value: ${{ jobs.metadata.outputs.is_preview }}
      is_release:
        value: ${{ jobs.metadata.outputs.is_release }}

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      pretty_version: ${{ steps.get_version.outputs.pretty_version }}
      is_dev: ${{ steps.get_version.outputs.is_dev }}
      is_preview: ${{ steps.get_version.outputs.is_preview }}
      is_release: ${{ steps.get_version.outputs.is_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Version channels and their "pretty" display names:
          # 1.0.0-dev          -> Developer    (build artifacts only, never published)
          # 1.0.0-preview.5    -> Preview 5    (public alpha pre-release)
          # 1.0.0              -> Release      (stable, public release)
          if [[ "$VERSION" =~ ^([0-9]+(\.[0-9]+)*)-dev$ ]]; then
            echo "is_dev=true" >> $GITHUB_OUTPUT
            echo "is_preview=false" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "pretty_version=${BASH_REMATCH[1]} Developer" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" =~ ^([0-9]+(\.[0-9]+)*)-preview\.([0-9]+)$ ]]; then
            echo "is_dev=false" >> $GITHUB_OUTPUT
            echo "is_preview=true" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "pretty_version=${BASH_REMATCH[1]} Preview ${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "is_dev=false" >> $GITHUB_OUTPUT
            echo "is_preview=false" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "pretty_version=$VERSION Release" >> $GITHUB_OUTPUT
          else
            echo "is_dev=false" >> $GITHUB_OUTPUT
            echo "is_preview=false" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "pretty_version=$VERSION" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.1.0

      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assemble :plugin:shadowJar --no-daemon --parallel
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

      - name: Verify plugin jar
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          from zipfile import ZipFile

          version = "${{ needs.metadata.outputs.version }}"
          jar = Path(f"plugin/build/libs/Tracel-{version}.jar")
          if not jar.is_file():
              raise SystemExit(f"Missing jar: {jar}")

          with ZipFile(jar) as zip_file:
              names = set(zip_file.namelist())

          required = [
              "paper-plugin.yml",
              "config.toml",
              "com/tracel/plugin/TracelPlugin.class",
          ]
          missing = [entry for entry in required if entry not in names]
          if missing:
              raise SystemExit(f"{jar} is missing entries: {missing}.")

          # Everything bundled is relocated under com/tracel/shaded: a library left at its own
          # package collides with the copy another plugin ships.
          unrelocated = sorted({
              prefix for prefix in ("org/bstats/", "org/tomlj/", "com/github/benmanes/caffeine/", "io/github/z4kn4fein/semver/")
              if any(name.startswith(prefix) for name in names)
          })
          if unrelocated:
              raise SystemExit(f"{jar} bundles unrelocated libraries: {unrelocated}.")

          with ZipFile(jar) as zip_file:
              descriptor = zip_file.read("paper-plugin.yml").decode("utf-8")
          if f"version: '{version}'" not in descriptor:
              raise SystemExit(f"paper-plugin.yml does not carry version {version}.")
          EOF

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp "plugin/build/libs/Tracel-${{ needs.metadata.outputs.version }}.jar" artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Tracel-${{ needs.metadata.outputs.version }}
          path: artifacts/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.1.0

      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Test with Gradle
        run: ./gradlew check --no-daemon --parallel --continue
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
