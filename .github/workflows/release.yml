name: Release

# Publishing pipeline. Manual only.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_publishable == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Extract changelog
        run: |
          python3 - <<'EOF'
          import re
          import sys

          with open("CHANGELOG.md") as f:
              content = f.read()

          version = "${{ needs.build.outputs.version }}"
          pretty_version = "${{ needs.build.outputs.pretty_version }}"
          is_preview = "${{ needs.build.outputs.is_preview }}" == "true"

          pattern = rf"^# {re.escape(pretty_version)}\s*\n(.*?)(?=\n# \S|\Z)"
          match = re.search(pattern, content, re.DOTALL | re.MULTILINE)

          if not match:
              if is_preview:
                  with open("changelog.md", "w") as f:
                      f.write("")
                  sys.exit(0)

              sys.exit(f"Version {version} not found in CHANGELOG.md")

          block = match.group(1)
          sections = re.split(r"^## ", block, flags=re.MULTILINE)
          lines = []

          for section in sections:
              if not section.strip():
                  continue

              header, _, body = section.partition("\n")
              lines.append(f"## {header.strip()}")

              for item in body.splitlines():
                  item = item.strip()
                  if item:
                      lines.append(item)

              lines.append("")

          with open("changelog.md", "w") as f:
              f.write("\n".join(lines).strip() + "\n")
          EOF

      - name: Upload changelog
        uses: actions/upload-artifact@v7.0.1
        with:
          name: changelog
          path: changelog.md
          retention-days: 30

  github:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [ build, changelog ]
    permissions:
      contents: write

    steps:
      - name: Download jar
        uses: actions/download-artifact@v8.0.1
        with:
          name: Tracel-${{ needs.build.outputs.version }}
          path: build/libs

      - name: Download changelog
        uses: actions/download-artifact@v8.0.1
        with:
          name: changelog

      - name: Create GitHub Release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ${{ needs.build.outputs.pretty_version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ needs.build.outputs.version }}
          github-commitish: ${{ github.sha }}
          github-prerelease: ${{ needs.build.outputs.is_preview == 'true' }}
          github-generate-changelog: false
          github-draft: false
          files: build/libs/Tracel-${{ needs.build.outputs.version }}.jar
          changelog-file: changelog.md

  modrinth:
    name: Modrinth
    runs-on: ubuntu-latest
    needs: [ build, changelog, github ]

    steps:
      - name: Download jar
        uses: actions/download-artifact@v8.0.1
        with:
          name: Tracel-${{ needs.build.outputs.version }}
          path: build/libs

      - name: Download changelog
        uses: actions/download-artifact@v8.0.1
        with:
          name: changelog

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: 'Tracel ${{ needs.build.outputs.pretty_version }}'
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.is_preview == 'true' && 'alpha' || 'release' }}
          files: build/libs/Tracel-${{ needs.build.outputs.version }}.jar
          changelog-file: changelog.md
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          loaders: |
            paper
            folia
          game-versions: |
            26.1
            26.1.1
            26.1.2
            26.2
            26.3
          game-version-filter: none
          dependencies: |
            luckperms(optional){modrinth:Vebnzrzj}
            worldedit(optional){modrinth:1u6JkXh5}
            fastasyncworldedit(optional){modrinth:z4HZZnLr}

  curseforge:
    name: CurseForge
    runs-on: ubuntu-latest
    needs: [ build, changelog, github ]

    steps:
      - name: Download jar
        uses: actions/download-artifact@v8.0.1
        with:
          name: Tracel-${{ needs.build.outputs.version }}
          path: build/libs

      - name: Download changelog
        uses: actions/download-artifact@v8.0.1
        with:
          name: changelog

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: 'Tracel ${{ needs.build.outputs.pretty_version }}'
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.is_preview == 'true' && 'alpha' || 'release' }}
          files: build/libs/Tracel-${{ needs.build.outputs.version }}.jar
          changelog-file: changelog.md
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          loaders: |
            paper
            folia
          game-versions: |
            26.1
            26.1.1
            26.1.2
            26.2
            26.3
          dependencies: |
            luckperms(optional){curseforge:431733}

  hangar:
    name: Hangar
    runs-on: ubuntu-latest
    needs: [ build, changelog, github ]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Download changelog
        uses: actions/download-artifact@v8.0.1
        with:
          name: changelog

      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Publish to Hangar
        run: ./gradlew :plugin:publishPluginPublicationToHangar --no-daemon
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_CHANNEL: ${{ needs.build.outputs.is_preview == 'true' && 'Snapshot' || 'Release' }}
          CHANGELOG_FILE: ${{ github.workspace }}/changelog.md
