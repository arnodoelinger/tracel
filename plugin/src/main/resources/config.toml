# Tracel configuration
# Support: https://discord.gg/uwMMZ2KWk6

[logging]
# What Tracel writes to the history
# Turning a kind off keeps what is already recorded; it takes a restart to apply
blocks = true
items = true
events = true
entities = true
entity-damage = true
worldedit = true

[rollback]
# Maximum number of entities restored without confirmation
# 0 = always ask for confirmation, "unlimited" = never ask
entity-restore-limit = 256

# Widest area, in blocks, that a rollback may cover
# "unlimited" = no limit
max-radius = 256

# How long a rollback or undo may run in one tick, e.g., 4ms, 10ms, 20ms
# It uses less time when the server is busy and more time when it is idle
min-tick-time = "5ms"
max-tick-time = "25ms"

[purge]
# Automatically delete old history
auto-purge = false

# How often it looks for old history, e.g., 14d, 30d, 90d
interval = "90d"

# How long each kind of history is kept; older records are deleted
# A time like 7d, 14d, 6w, or "forever" to keep it all
keep-blocks = "90d"
keep-items = "90d"
keep-containers = "90d"
keep-events = "90d"

[advanced]
# How often Tracel forces pending history to disk
# "every-batch" = saves every commit safely before continuing
# "<duration>" = saves at most once per interval, e.g., 500ms, 1s, 5s
# "never" = never force changes to disk; not for production
sync = "every-batch"

# Amount of memory used before history is written to disk
memtable-size = "16MiB"

# Maximum number of pending disk writes before Tracel starts slowing down
max-pending-flushes = 3

# Number of events that can be buffered during bursts of activity
capture-ring-slots = 65536
